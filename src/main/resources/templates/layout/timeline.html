<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>SourJellyGram</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/user/list/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <th:block layout:fragment="style"></th:block>
</head>
<body>

<div id="wrap">
    <header class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img class="ml-3" width="100" height="75" alt="sourJellyGramLogo" src="https://cdn.pixabay.com/photo/2016/07/13/09/43/gummy-bears-1514016_640.png">
            <div>SourJellyGram</div>
        </div>
        <div th:if="${session.user != null}" class="dropdown mr-4">
            <button class="btn" type="button" data-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle h1"></i>
            </button>
            <div class="dropdown-menu text-center">
                <div class="mr-3"><span th:text="${session.user.getName()}" class="mr-2" >유재석</span></div>
                <a class="font-weight-bold" href="/user/logout">로그아웃</a>
                <a class="dropdown-item" href="/main/add">게시물 작성하기</a>
            </div>
        </div>
    </header>
    <th:block layout:fragment="contents">

    </th:block>
    <footer class="d-flex align-items-center justify-content-center">
        <div>ⓒ 2025. sourjelly All rights reserved.</div>
    </footer>
</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
<th:block layout:fragment="script"></th:block>


</body>
</html>
