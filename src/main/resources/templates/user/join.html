<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/user/password/css/style.css">
</head>
<body>

<div id="wrap" class="d-flex align-items-center">
    <div class="content bg-secondary ">
        <div class="main-content">
            <div class="d-flex justify-content-center my-3">
                <img class="center" width="150" height="120" src="https://cdn.pixabay.com/photo/2013/03/15/09/13/candies-93988_640.jpg">
            </div>

            <div class="join-ment d-flex justify-content-center  my-3">
                SourJellyGram가입하기
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="text" id="loginIdInput" class="form-control form-control-lg col-5 mx-1" placeholder="아이디">
                <button id="confirmBtn" class="btn btn-lg col-2 ">중복확인</button>
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="password" id="passwordInput" class="form-control form-control-lg col-7 mx-3 " placeholder="비밀번호">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="password" id="confirmPasswordInput" class="form-control form-control-lg col-7 mx-3 " placeholder="비밀번호 확인">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="password" id="phoneNumberInput" class="form-control form-control-lg col-7 mx-3 " placeholder="전화번호">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="password" id="emailInput" class="form-control form-control-lg col-7 mx-3 " placeholder="이메일">
            </div>

            <div class="d-flex justify-content-center my-3">
                <button id="joinBtn" type="button" class="btn btn-lg btn-block col-7 ">가입하기</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
