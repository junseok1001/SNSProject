<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/user/password/css/style.css">
</head>
<body>

<div id="wrap" class="d-flex align-items-center">
    <div class="content ">
        <div class="main-content">
            <div class="d-flex justify-content-center my-3">
                <img class="center" width="200" height="140" src="https://cdn.pixabay.com/photo/2016/07/13/09/43/gummy-bears-1514016_640.png">
            </div>

            <div class="join-ment d-flex justify-content-center font-weight-bold  my-3">
                SourJellyGram가입하기
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="text" id="loginIdInput" class="form-control form-control-lg col-5 mx-1" placeholder="아이디" name="loginId" data-duplicate=false>
                <button id="confirmBtn" class="btn btn-lg col-2 ">중복확인</button>
            </div>
            <div class="d-flex justify-content-center ">
                <div id="isDuplicate" class="text-small text-danger d-none">중복된 ID 입니다</div>
            </div>
            <div class="d-flex justify-content-center ">
                <div id="isAvailable" class="text-success text-small d-none">사용가능한 ID 입니다.</div>
            </div>


            <div class="d-flex justify-content-center my-3">
                <input type="password" id="passwordInput" class="form-control form-control-lg col-7 mx-3 " placeholder="비밀번호">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="password" id="confirmPasswordInput" class="form-control form-control-lg col-7 mx-3 " placeholder="비밀번호 확인">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="text" id="phoneNumberInput" class="form-control form-control-lg col-7 mx-3 " placeholder="전화번호">
            </div>

            <div class="d-flex justify-content-center my-3">
                <input type="text" id="emailInput" class="form-control form-control-lg col-7 mx-3 " placeholder="이메일">
            </div>

            <div class="d-flex justify-content-center my-3">
                <button id="joinBtn" type="button" class="btn btn-lg btn-block col-7 ">가입하기</button>
            </div>
        </div>
    </div>
</div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        var isDuplicateCheck = false;

        $("#loginIdInput").on("input", function(){

            $("#isAvailable").addClass("d-none");
            $("#isDuplicate").addClass("d-none");
        });

        $("#confirmBtn").on("click",function(){
            let id = $("#loginIdInput").val();

            if(id == ""){
                alert("아이디를 입력하세요;")
                return;
            }

            $.ajax({
                type:"get"
                , url:"/user/duplicate-id"
                , data:{"loginId": id}
                , success:function(response){
                    isDuplicateCheck = true;

                    if(response.isDuplicate){
                        $("#isDuplicate").removeClass("d-none");
                        $("#isAvailable").addClass("d-none");
                        $("input[name='loginId']").data("duplicate", false);
                    }else{
                        $("#isAvailable").removeClass("d-none");
                        $("#isDuplicate").addClass("d-none");
                        $("input[name='loginId']").data("duplicate", true);
                    }
                }
                ,error:function(){
                    alert("중복 에러!!");
                }
            });

        });

        $("#joinBtn").on("click", function(){
            let id = $("#loginIdInput").val();
            let password = $("#passwordInput").val();
            let confirmPassword = $("#confirmPasswordInput").val();
            let phoneNumber = $("#phoneNumberInput").val();
            let email = $("#emailInput").val();

            let isVailable = $("input[name='loginId']").data("duplicate");

            console.log(isVailable);

            if(id == ""){
                alert("아이디를 입력하세요;")
                return;
            }

            // 중복 체크아 안됐을 경우
            if(!isDuplicateCheck){
                alert("중복확인을 해주세요");
                return;
            }

            //id 가 중복일 경우
            if(isVailable == false){
                alert("ID가 중복되었습니다.");
                return;
            }

            if(password == ""){
                alert("비밀번호를 입력하세요.")
                return;
            }

            if(password != confirmPassword){
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            if(phoneNumber == ""){
                alert("전화번호를 입력하세요");
                return;
            }

            if(email == ""){
                alert("이메일을 입력하세요");
                return;
            }

            $.ajax({
                type:"post"
                , url:"/user/join-process"
                , data:{"loginId":id, "password": password, "phoneNumber": phoneNumber, "email":email}
                , success:function(response){
                    if(response.result == "success"){
                        location.href="/user/login";
                    }else{
                        alert("회원가입 실패!");
                    }

                }
                , error: function(){
                    alert("회원가입 에러!!");
                }
            });


        });


    </script>
</body>
</html>
