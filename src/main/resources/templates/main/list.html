                <!--중단 이미지-->
                <div class="image-area d-flex justify-content-center">
                    <img class="time-line-image"  width="700" height="450" th:src="${post.imagePath}" src="https://cdn.pixabay.com/photo/2017/09/04/18/39/coffee-2714970_640.jpg">
                </div>

                <!-- 하트랑 목록-->
                <div class="heart-list-area d-flex justify-content-between">
                    <div class="d-flex align-items-center ml-4">
                        <i class="unlike-btn bi bi-heart-fill text-danger d-none" th:data-post-id="${post.id}"></i>
                        <i class="like-btn bi bi-heart" th:data-post-id="${post.id}"></i>
                        <div class="font-weight-bold ml-2">좋아요 <span th:text="${post.likeCount}">5</span></div>
                    </div>


                    <div class="dropdown mr-4">
                        <button class="btn" type="button" data-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-three-dots-vertical h2"></i>
                        </button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">삭제하기</a>
                            <a class="dropdown-item" href="#">게시물로 이동</a>
                            <a class="dropdown-item" href="#">취소</a>
                        </div>
                    </div>
                </div>

                <div class="hastag-area ml-4">
                    #오늘의 커피한잔. #따뜻한거 먹자 #카페인 중독
                </div>

                <hr>

                <!-- 댓글 부분 -->
                <div   class="comment-area ml-4 ">
                    <div class="comment-box d-flex align-items-center ">
                        <div><b >user-name</b></div>
                        <p  class="ml-3 my-2 text-wrap">분위가가 좋네요</p>
                    </div>
                </div>

                <!-- /댓글 부분 -->
                <!-- 댓글 작성 -->
                <div class="input-group mb-3 container mt-3">
                    <input  type="text" class="comment-input form-control" placeholder="댓글을 작성하세요">
                    <button th:data-post-id="${post.id}" class="sendComment btn btn-info" type="button" ><i class="bi bi-send"></i></button>
                </div>

            </div>
        </div>
    </section>

<script layout:fragment="script">

    $(".like-btn").on("click", function(){
        let postId = $(this).data("post-id");

        $.ajax({
            type:"post"
            , url:"/post/like"
            , data:{"postId": postId}
            , success: function(response){

                if(response.result == "success"){
                    location.reload();
                }else{
                    alert("좋아요 실패!!");
                }

            }
            , error: function(){
                alert("좋아요 에러!!");
            }

        });
    });


    $(".sendComment").on("click", function(){
        let postId = $(this).data("post-id");
        // 부모 div 찾기 div 의 특정값이 들어가 있으니 그걸로 찾기
        let parentDiv = $(this).closest(".input-group");

        let comment = parentDiv.find(".comment-input").val();

        console.log(comment);

        $.ajax({
            type:"get"
            , url:"/post/comment-add"
            , data:{"postId":postId, "comment":comment}
            , success: function(response){

                if(response.result == "success"){
                    location.reload();

                }else{
                    alert("댓글 작성 실패!!");
                }

            }
            ,error: function(){
                alert("댓글 작성 에러!");
            }
        });
    });

</script>

</html>
