<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/timeline}">

<section layout:fragment="contents">
    <div class="contents p-3">
        <div class="d-flex justify-content-center">
            <input th:value="${post.title}" id="titleInput" class="form-control text-center mt-3 col-10" tpye="text" placeholder="제목을 입력하세요">
        </div>
        <label class="mt-3 font-weight-bold">내용을 입력하세요</label>
        <textarea th:text="${post.contents}" id="contentInput" class="form-control" rows="20" cols="128"> </textarea>
        <div class="my-2">
            <img alt="게시물의 사진" th:src="${post.imagePath}">
        </div>

        <div class="d-flex justify-content-end mt-3">
            <div>
                <button id="formInput" class="btn btn-success mr-2" type="button">수정하기</button>
                <a class="btn btn-danger" href="/main/list" type="">목록으로 돌아가기</a>
            </div>
        </div>
    </div>
</section>

</html>
